name: Build .pyd (Cython)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Python ${{ matrix.python }} (win_amd64)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install Cython setuptools wheel

      - name: Compile .py -> .pyd
        env:
          PYTHONIOENCODING: utf-8
        run: python build_pyd.py

      - name: Package plugin
        id: package
        shell: pwsh
        run: |
          $pyVer = "${{ matrix.python }}" -replace '\.', ''
          $root = (Get-Location).Path
          $pkg   = Join-Path $root "plugin-cp$pyVer-win_amd64"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item -Force -Path "main.py", "cwplugin.json", "icon.png", "README.md", "pyproject.toml" -Destination $pkg
          Copy-Item -Recurse -Force -Path "http_api_plugin" -Destination $pkg
          if (Test-Path "docs") { Copy-Item -Recurse -Force -Path "docs" -Destination $pkg }

          $zip = Join-Path $root "http-api-cp$pyVer-win_amd64.zip"
          Compress-Archive -Force -Path (Join-Path $pkg "*") -DestinationPath $zip
          Get-ChildItem $zip
          Write-Output "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: http-api-cp${{ matrix.python }}-win_amd64
          path: ${{ steps.package.outputs.zip }}

  release:
    name: Release (draft)
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*.zip